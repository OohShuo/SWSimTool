name: Fast and medium regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./tools/build/RunSuite.ps1 -Tier Fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-reports
          path: |
            build/logs
            build/reports
  medium:
    needs: fast
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r runtime/python/requirements.txt fast-simplification
      - run: ./tools/build/RunSuite.ps1 -Tier Medium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medium-reports
          path: |
            build/logs
            build/reports
            build/native-parity-report.json
