name: Portable core and compiled platform parity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Identical compiler/numeric versions make OS differences independently testable.
      - run: python -m pip install mujoco==3.14.0 numpy==2.2.4 fast-simplification==0.2.0 pymeshlab==2025.7.post1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopengl0
      - run: python -B tests/platform/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-${{ runner.os }}
          path: build/reports/platform
  compiled-equivalence:
    needs: platform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install mujoco==3.14.0 numpy==2.2.4
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          merge-multiple: true
          path: build/reports/platform
      - run: python -B tests/platform/compare.py
